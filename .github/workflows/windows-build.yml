name: Build Windows executable and installer

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pip==24.2"
          python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build single-file executable
        shell: pwsh
        run: >-
          python -m PyInstaller --clean --noconfirm
          src/Synapic.Inference/synapic-inference.spec

      - name: Smoke-test executable health endpoint
        shell: pwsh
        run: |
          $env:SYNAPIC_HOST = "127.0.0.1"
          $env:SYNAPIC_PORT = "18080"
          $process = Start-Process `
            -FilePath "$env:GITHUB_WORKSPACE\dist\synapic-inference.exe" `
            -WorkingDirectory "$env:GITHUB_WORKSPACE\dist" `
            -PassThru
          $health = $null
          try {
            for ($attempt = 0; $attempt -lt 20 -and $null -eq $health; $attempt++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 2
              } catch {
                if ($process.HasExited) {
                  throw "Inference executable exited before /health became available. Exit code: $($process.ExitCode)"
                }
              }
            }
            if ($null -eq $health -or $health.status -ne "ok") {
              throw "Health endpoint did not return status=ok."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.3.3 --no-progress --yes

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: 0.1.0.${{ github.run_number }}
        run: >-
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /Qp "$env:GITHUB_WORKSPACE\installer\synapic-inference.iss"

      - name: Upload executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: synapic-inference-windows-${{ github.sha }}
          path: |
            dist/synapic-inference.exe
            dist/synapic-inference-installer.exe
          if-no-files-found: error
          retention-days: 14
